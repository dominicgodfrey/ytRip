<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytRip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><path d='M5 3v10l8-5z' fill='%2300e000'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <span class="logo">YTRIP</span>
    <span class="grip"></span>
    <button id="quit" class="tiny" title="Quit ytRip">&#x23FB;</button>
  </header>

  <section class="deck">
    <div class="lcd" id="lcd"><span id="lcd-text">READY</span></div>
    <form id="search" class="searchrow" autocomplete="off">
      <input id="q" class="lcd-input" placeholder="search songs, albums, artists... or paste a link" autofocus>
      <button class="btn primary" type="submit">GO</button>
    </form>
    <div class="controls">
      <label class="led"><input type="checkbox" id="src-ytm" checked><i></i>YT MUSIC</label>
      <label class="led"><input type="checkbox" id="src-yt"><i></i>YOUTUBE</label>
      <span class="spacer"></span>
      <label class="fmt">FORMAT
        <select id="format"><option value="mp3">MP3</option><option value="m4a">M4A</option><option value="opus">OPUS</option></select>
      </label>
    </div>
  </section>

  <div class="main">
    <section class="panel browser">
      <nav class="tabs" id="tabs">
        <button data-tab="songs" class="on">SONGS</button>
        <button data-tab="albums">ALBUMS</button>
        <button data-tab="playlists">PLAYLISTS</button>
        <button data-tab="artists">ARTISTS</button>
      </nav>
      <div class="list" id="results"><p class="empty">Type something and hit GO.</p></div>
    </section>

    <aside class="panel queue">
      <div class="panel-head">
        <span>QUEUE</span>
        <button id="clear" class="tiny" title="Remove finished items">CLR</button>
      </div>
      <div class="list" id="jobs"><p class="empty">Nothing queued.</p></div>
    </aside>
  </div>

  <footer class="panel settings">
    <label for="library">LIBRARY</label>
    <input id="library" class="lcd-input small" spellcheck="false">
    <button id="save-lib" class="btn">SAVE</button>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
